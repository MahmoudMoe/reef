name: reef selftests
on:
  # the PR is the one run (the owner, a solo developer, 2026-11-01: "once"): the squash-merge lands the tree the PR tested
  pull_request:

permissions:
  contents: read

# a newer push to the PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # ubuntu sh=dash: the honest POSIX check
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: on macOS, the Python a Mac ships (/usr/bin/python3, 3.9) — Reef's floor (tests/test_python_floor.py)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/py" && ln -sf /usr/bin/python3 "$RUNNER_TEMP/py/python3"
          echo "$RUNNER_TEMP/py" >> "$GITHUB_PATH"
          /usr/bin/python3 --version
      - name: run sabotage suites
        run: python3 --version && sh tests/run.sh

  stress:
    # the stress suites (tests/stress_*.py, docs/review/stress-2026-11-02.md) beside the selftests, not inside them: the macOS
    # selftests already take ~13 of their 15 minutes
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: on macOS, the Python a Mac ships (/usr/bin/python3, 3.9)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/py" && ln -sf /usr/bin/python3 "$RUNNER_TEMP/py/python3"
          echo "$RUNNER_TEMP/py" >> "$GITHUB_PATH"
      - name: run the stress suites
        run: REEF_NO_RESUME=1 python3 -m unittest discover -s tests -p 'stress_*.py' -q

  shipped-change-bumps-the-version:
    # 2026-11-02: Claude Code re-installs a plugin only on a new version; a shipped change with the same version never reaches
    # a session (the cache ran 84 commits behind main). `python3 .github/bump-version.py` writes the next one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: agents/ skills/ hooks/ scripts/ templates/ commands/ changed => a new version
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          shipped=$(git diff --name-only "$base" HEAD | grep -E '^(agents|skills|hooks|scripts|templates|commands|schemas|migrations)/' || true)
          [ -z "$shipped" ] && { echo "nothing shipped changed"; exit 0; }
          v() { python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])'; }
          old=$(git show "$base:.claude-plugin/plugin.json" | v); new=$(v < .claude-plugin/plugin.json)
          [ "$old" != "$new" ] && { echo "ok: $old -> $new"; exit 0; }
          echo "FAIL: shipped files changed and the version is still $old — run: python3 .github/bump-version.py"; exit 1

  code-change-needs-a-test:
    # 1.6: a change to a CLASS: code script is a change to a mechanism; a mechanism without a test
    # that shows it red is decoration. This repository has no git hooks, so the rule is a CI job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a CLASS code script changed => tests/ changed too
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          code=""
          for f in $changed; do
            case "$f" in scripts/reef-*|scripts/reef_*|templates/pre-commit)
              [ -f "$f" ] && head -3 "$f" | grep -q '^# CLASS: code' && code="$code $f" ;;
            esac
          done
          [ -z "$code" ] && { echo "no code-class script changed"; exit 0; }
          echo "$changed" | grep -q '^tests/' && { echo "ok: tests/ changed alongside:$code"; exit 0; }
          echo "FAIL: code-class script(s) changed without a tests/ change:$code"; exit 1
