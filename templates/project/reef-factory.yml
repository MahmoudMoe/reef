name: Reef factory

# The factory on GitHub Actions (workflow v3, phase 7): a queue row builds in the Actions sandbox instead of on the
# owner's machine. A row's issue labelled `reef-ready` by an ADMIN starts a job that runs ONE command,
# `scripts/reef-factory.py row`: it checks who asked (the labeler and the issue's author must be admins — the issue's
# body is the planner's spec), that `{{base}}` is a protected branch, resumes the row's feature branch from the forge,
# proves the guard reaches a headless session here (fail closed), records the owner's plan approval from an UNEDITED
# comment on the row's issue (`Approve plan <slug> at <digest16>?`, by an admin), runs the row's state machine headless
# (`reef-run.py --row`), pushes the feature branch back (the next job resumes from it) and writes the row's state as a
# label (`reef-building`, `reef-review`, `reef-waiting-owner`). `workflow_dispatch` builds a row by id the same way.
#
# To weigh before accepting (reef-init offers this file, never writes it):
# - minutes on a private repository; the model's credential as ONE repository secret, scoped to the step that runs the model:
#   ANTHROPIC_API_KEY (an API key, billed per token) or CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, a Claude subscription);
#   the six-hour job limit (every step is on disk and at the forge: the job resumes across runs);
# - pushes and PRs made with GITHUB_TOKEN start no workflow: with `ci.feature_gate: ci` the loop's merge waits for a CI
#   run that never comes. Either keep the feature gate `local` (the job's full gate writes the evidence) or add a
#   fine-grained token REEF_TOKEN scoped to THIS repository (contents, issues, pull requests) — never a classic PAT;
# - the plugin is pinned to the commit this project's scripts came from; `reef-update` moves both together.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      row:
        description: "the queue row id to build"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: reef-factory
  cancel-in-progress: false   # one orchestrator at a time, as on a laptop

jobs:
  row:
    if: github.event_name != 'issues' || github.event.label.name == 'reef-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: {{base}}
          fetch-depth: 0
          token: ${{ secrets.REEF_TOKEN || secrets.GITHUB_TOKEN }}
{{setup_steps}}
      - name: Claude Code and the Reef plugin at the commit this project's scripts came from
        run: |
          npm i -g @anthropic-ai/claude-code
          git clone -q {{reef_repo}} "$RUNNER_TEMP/reef"
          git -C "$RUNNER_TEMP/reef" checkout -q {{reef_ref}}
          git config user.name "reef-factory"
          git config user.email "reef-factory@users.noreply.github.com"
          git config core.hooksPath .githooks
      - name: The row, by the one command that carries every check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.REEF_TOKEN || secrets.GITHUB_TOKEN }}
          REEF_CLAUDE_ARGS: --plugin-dir ${{ runner.temp }}/reef
          ISSUE: ${{ github.event.issue.number }}
          ROW: ${{ inputs.row }}
          ACTOR: ${{ github.actor }}
        run: |
          case "$ROW" in ''|*[!0-9]*) ROW= ;; esac
          if [ -n "$ISSUE" ]; then python3 scripts/reef-factory.py row --issue "$ISSUE" --actor "$ACTOR" --max-iterations 4
          elif [ -n "$ROW" ]; then python3 scripts/reef-factory.py row --row "$ROW" --actor "$ACTOR" --max-iterations 4
          else echo "no issue and no row id" >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reef-run
          path: |
            .reef/run/run.log
            .reef/run/gate.json
          if-no-files-found: ignore
