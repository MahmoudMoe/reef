version: 2
updates:
  - package-ecosystem: "{{ecosystem}}"
    directory: "/"
    target-branch: "{{base}}"      # never against {{release}}: a PR there would sit and go stale
    schedule:
      interval: "weekly"
    groups:
      all-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "{{base}}"
    schedule:
      interval: "weekly"
